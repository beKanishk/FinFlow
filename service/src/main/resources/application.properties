spring.application.name=FinFlow

# ${VAR:default} falls back to the same localhost values as before when the env var isn't set, so
# local dev (./gradlew :service:bootRun against docker-run Postgres/Redis/Kafka on localhost) is
# unaffected - only a containerized run (Docker/EC2) needs to actually set these.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

auth.public-paths=/auth/register,/auth/token,/auth/validate,/health,/users/register,/,/index.html,/app.js,/style.css,/payments/webhook

spring.jackson.time-zone=Asia/Kolkata

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=finflow-payment-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
